<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <style>
    .line {
      fill: none;
      stroke: #181816;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .star {
      fill: #181816;
    }
    .wordmark {
      font-family: 'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif;
      font-size: 86px;
      font-weight: 500;
      letter-spacing: 0.22em;
      fill: #181816;
      text-anchor: middle;
    }
  </style>

  <!-- Tilted Orbital Halo & Four-Point Star -->
  <ellipse class="line" cx="400" cy="212" rx="68" ry="24" transform="rotate(-14 400 212)" />
  <path class="star" d="M 400 192 Q 403 209 420 212 Q 403 215 400 232 Q 397 215 380 212 Q 397 209 400 192 Z" />

  <!-- Open Architectural Book Pages -->
  <!-- Outer Pages -->
  <path class="line" d="M 280 282 L 256 290 L 256 426 L 400 456 L 544 426 L 544 290 L 520 282" />
  <!-- Middle Pages -->
  <path class="line" d="M 298 268 L 278 276 L 278 412 L 400 456 L 522 412 L 522 276 L 502 268" />
  <!-- Inner Pages -->
  <path class="line" d="M 400 296 L 298 250 L 298 396 L 400 456 L 502 396 L 502 250 Z" />
  <!-- Center Spine Lower Segment -->
  <line class="line" x1="400" y1="415" x2="400" y2="456" />

  <!-- Drafting Compass -->
  <!-- Top Handle -->
  <path class="line" d="M 393 282 L 393 266 A 7 7 0 0 1 407 266 L 407 282" />
  <!-- Hinge Circle -->
  <circle class="line" cx="400" cy="300" r="19" fill="#ffffff" />
