  <path class="line" d="M 334 352 A 84 84 0 0 0 466 352" />
  <line class="line" x1="400" y1="364" x2="400" y2="390" />
  <!-- Left & Right Compass Legs -->
  <path class="line" d="M 386 314 L 315 456 L 323 475 L 398 319" fill="#ffffff" />
  <path class="line" d="M 414 314 L 485 456 L 477 475 L 402 319" fill="#ffffff" />

  <!-- GEEKYARD Wordmark -->
